

# Servidor
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/cineticket
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mensageria (RabbitMQ)
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Security (JWT e Senhas Secretas via .env)
api.security.token.secret=${JWT_SECRET}

# B2B
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY}

# Origens separadas por vírgula. Obrigatória em produção.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework

# Fail-closed até existir integração real e autenticada com um gateway.
payments.enabled=${PAYMENTS_ENABLED:false}
payments.mock.enabled=false

# Cookie do refresh token em produção: HTTPS obrigatório; SameSite=None porque o
# frontend fica em outro domínio (ex.: Vercel/Netlify + API no Render).
app.auth.refresh-cookie.secure=true
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}

# Admin inicial. Desligado por padrão; ao ligar, ADMIN_EMAIL e ADMIN_PASSWORD (12 a 72 caracteres) são obrigatórios.
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.name=${ADMIN_NAME:Administrador}
