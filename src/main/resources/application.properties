spring.application.name=cine-ticket
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Paginação em formato estável: {content: [...], page: {size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Métricas: tag comum e histograma de latência HTTP (p95/p99 no Grafana).
management.metrics.tags.application=cineticket
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.metrics.business.refresh-interval-ms=30000

# Documentação OpenAPI: /v3/api-docs (JSON) e /swagger-ui.html (interface interativa)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

logging.pattern.level=%5p [corr:%X{correlationId:-}]

# Autenticação: access token JWT curto + refresh token rotativo em cookie HttpOnly.
api.security.token.access-ttl=15m
app.auth.refresh-token.ttl=7d
# Duas abas renovando juntas: reuso do token recém-trocado é aceito por este tempo.
app.auth.refresh-token.reuse-grace=30s
# Força bruta por conta: bloqueia o login após N senhas erradas seguidas.
app.auth.login.max-attempts=5
app.auth.login.lock-duration=15m

# Reserva de assento: prazo para pagar um ingresso PENDING, limite por usuário e frequência do job de expiração.
tickets.pending.ttl=10m
tickets.pending.max-per-user=4
# Cota de meia-entrada por sessão (Lei 12.933/2013: 40% dos lugares).
tickets.half-price.quota=0.40
tickets.pending.expiration-check-interval-ms=60000
# Entrada na sala liberada a partir de quanto tempo antes do início da sessão.
app.tickets.validation.opens-before=60m

# Transactional outbox: eventos gravados junto com a regra de negócio e publicados por um relay.
# O relay só marca o evento como publicado depois da confirmação do broker (publisher confirm).
spring.rabbitmq.publisher-confirm-type=simple
# Consumidores: até 3 tentativas com intervalo crescente (2 s, 6 s); depois a mensagem vai
# para a DLQ da fila (sem requeue infinito). Os consumidores são idempotentes.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=3
outbox.relay.interval-ms=2000
outbox.relay.batch-size=50
outbox.relay.confirm-timeout-ms=5000
outbox.retention=7d

# Pagamento. provider=mock (simulador, padrão) ou stripe (modo de teste: só chaves sk_test_).
# Com Stripe, a aprovação chega pelo webhook POST /api/v1/payments/webhook.
payments.provider=${PAYMENTS_PROVIDER:mock}
payments.currency=brl
payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payments.stripe.webhook-tolerance-seconds=300
