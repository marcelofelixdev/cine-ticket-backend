# Perfil de demonstração pública. Sempre combinado com outro perfil (o último vence):
#   deploy: PROFILE=prod,demo      local: PROFILE=dev,demo
# Popula filmes (TMDB), cinemas, salas e sessões dos próximos 7 dias, cria o visitante
# e faz um reset diário das compras.

# Compras liberadas. Simulador por padrão; com PAYMENTS_PROVIDER=stripe usa o Stripe em modo
# de teste (cartões de teste como pm_card_visa). Nenhum valor real é cobrado em nenhum dos dois.
payments.enabled=true
payments.provider=${PAYMENTS_PROVIDER:mock}

# Login público do visitante (exibido em GET /api/v1/demo/info).
app.demo.visitor.email=${DEMO_VISITOR_EMAIL:visitante@cineticket.dev}
app.demo.visitor.password=${DEMO_VISITOR_PASSWORD:visitante123456}
app.auth.login.lockout-exempt-emails=${app.demo.visitor.email}

# Equipe pública do demo, no primeiro cinema: funcionário (valida ingressos) e gerente.
app.bootstrap.staff.enabled=true
app.bootstrap.staff.email=${STAFF_EMAIL:funcionario@cineticket.dev}
app.bootstrap.staff.password=${STAFF_PASSWORD:funcionario12345}
app.bootstrap.manager.enabled=true
app.bootstrap.manager.email=${MANAGER_EMAIL:gerente@cineticket.dev}
app.bootstrap.manager.password=${MANAGER_PASSWORD:gerente12345}

# Reset diário (horário de Brasília).
app.demo.reset-cron=0 0 4 * * *
