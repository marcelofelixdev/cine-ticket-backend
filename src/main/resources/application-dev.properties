server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/cineticket
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
api.security.token.secret=${JWT_SECRET}

# API do TMDB
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY}

# Mensageria (RabbitMQ)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=10

# Compras liberadas; o gateway vem de payments.provider (simulador por padrão, ou Stripe de teste).
payments.enabled=true

# Cookie do refresh token em dev: frontend e API em localhost (mesmo site), sem HTTPS.
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax

# Admin inicial (somente desenvolvimento). Criado no boot se ainda não existir.
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin.email=${ADMIN_EMAIL:marcelo@admin.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin12345678}
app.bootstrap.admin.name=${ADMIN_NAME:Administrador}

# Funcionário da entrada (ROLE_STAFF), só valida ingressos.
app.bootstrap.staff.enabled=${STAFF_BOOTSTRAP_ENABLED:true}
app.bootstrap.staff.email=${STAFF_EMAIL:funcionario@cineticket.dev}
app.bootstrap.staff.password=${STAFF_PASSWORD:funcionario12345}

# Segredo do QR Code dos ingressos (HMAC). Em produção, QR_SECRET é obrigatório.
app.tickets.qr-secret=${QR_SECRET:dev-only-qr-secret-troque-em-producao-0123456789}
