$kind: http-request
name: Get All Movies
method: GET
url: '{{baseUrl}}/api/v1/movies'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      if (status === 200) {
          pm.test("Status é 200 (sucesso)", function () {
              pm.expect(status).to.equal(200);
          });

          pm.test("Body é um array", function () {
              const json = pm.response.json();
              pm.expect(json).to.be.an("array");
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Tempo de resposta menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

          pm.test("Se não vazio, cada item contém id", function () {
              const json = pm.response.json();
              if (json.length > 0) {
                  json.forEach(function (movie) {
                      pm.expect(movie).to.have.property("id");
                  });
              }
          });

      } else if (status === 401) {
          pm.test("Status é 401 (não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });
      }
