$kind: http-request
name: Create Movie
method: POST
url: '{{baseUrl}}/api/v1/movies'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Inception",
      "sinopse": "A thief who steals corporate secrets through dream-sharing technology.",
      "tmdbId": "27205",
      "duracaoEmMinutos": 148
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      if (status === 200 || status === 201) {
          pm.test("Status é 200 ou 201 (criado com sucesso)", function () {
              pm.expect(status).to.be.oneOf([200, 201]);
          });

          pm.test("Body contém id do filme", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("id");
              pm.environment.set("movieId", json.id);
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Tempo de resposta menor que 3000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(3000);
          });

      } else if (status === 401) {
          pm.test("Status é 401 (não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });

      } else if (status === 422) {
          pm.test("Status é 422 (erro de validação)", function () {
              pm.expect(status).to.equal(422);
          });

          pm.test("Body contém error = 'Erro de Validação de Dados'", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("error");
              pm.expect(json.error).to.equal("Erro de Validação de Dados");
          });

      } else if (status === 500) {
          pm.test("Status é 500 (erro interno)", function () {
              pm.expect(status).to.equal(500);
          });

          pm.test("Body contém error e message", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("error");
              pm.expect(json).to.have.property("message");
          });
      }
