$kind: http-request
name: Get Movie by ID
method: GET
url: '{{baseUrl}}/api/v1/movies/{{movieId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      if (status === 200) {
          pm.test("Status é 200 (sucesso)", function () {
              pm.expect(status).to.equal(200);
          });

          pm.test("Body contém id do filme", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("id");
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Tempo de resposta menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

      } else if (status === 401) {
          pm.test("Status é 401 (não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });

      } else if (status === 500) {
          pm.test("Status é 500 (erro interno)", function () {
              pm.expect(status).to.equal(500);
          });

          pm.test("Body contém message com 'Filme não encontrado'", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("message");
              pm.expect(json.message).to.include("Filme não encontrado");
          });
      }
