$kind: http-request
name: Create Movie
description: |-
  Com um título real (ex.: "Matrix"), sinopse e pôster vêm do TMDB. Aqui o título é único por execução para a coleção poder rodar várias vezes.
method: POST
url: '{{baseUrl}}/api/v1/movies'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "{{movieTitle}}",
      "duracaoEmMinutos": 120
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("movieId", pm.response.json().id);
