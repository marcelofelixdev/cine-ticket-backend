$kind: http-request
name: Get Ticket
url: '{{baseUrl}}/api/v1/tickets/me'
method: GET
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const statusCode = pm.response.code;

      if (statusCode === 200) {
          pm.test("Status é 200", function () {
              pm.expect(statusCode).to.eql(200);
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Response time é menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

          const json = pm.response.json();

          pm.test("Body é um array", function () {
              pm.expect(json).to.be.an("array");
          });

          if (json.length > 0) {
              pm.test("Cada item do array contém campo 'id'", function () {
                  json.forEach(function (ticket) {
                      pm.expect(ticket).to.have.property("id");
                  });
              });

              pm.test("Cada item do array contém campo 'valorPago'", function () {
                  json.forEach(function (ticket) {
                      pm.expect(ticket).to.have.property("valorPago");
                  });
              });

              pm.test("Cada item do array contém campo 'ticketType'", function () {
                  json.forEach(function (ticket) {
                      pm.expect(ticket).to.have.property("ticketType");
                  });
              });

              pm.test("Cada item do array contém campo 'status'", function () {
                  json.forEach(function (ticket) {
                      pm.expect(ticket).to.have.property("status");
                  });
              });
          }

      } else if (statusCode === 401) {
          pm.test("Status é 401 (não autorizado)", function () {
              pm.expect(statusCode).to.eql(401);
          });

      } else {
          pm.test("Status inesperado: " + statusCode, function () {
              pm.expect.fail("Status inesperado: " + statusCode);
          });
      }
