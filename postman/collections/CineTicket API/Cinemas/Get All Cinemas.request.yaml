$kind: http-request
name: Get All Cinemas
method: GET
url: '{{baseUrl}}/api/v1/cinemas'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      if (status === 200) {
          const json = pm.response.json();

          pm.test("Status é 200 (OK)", function () {
              pm.expect(status).to.equal(200);
          });

          pm.test("Body é um array", function () {
              pm.expect(json).to.be.an("array");
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Tempo de resposta menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

          if (json.length > 0) {
              pm.test("Cada item contém id", function () {
                  json.forEach(function (item) {
                      pm.expect(item).to.have.property("id");
                  });
              });

              pm.test("Cada item contém nome", function () {
                  json.forEach(function (item) {
                      pm.expect(item).to.have.property("nome");
                  });
              });

              pm.test("Cada item contém cnpj", function () {
                  json.forEach(function (item) {
                      pm.expect(item).to.have.property("cnpj");
                  });
              });
          }

      } else if (status === 401) {
          pm.test("Status é 401 (Não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });

      } else {
          pm.test("Status inesperado: " + status, function () {
              pm.expect.fail("Status não mapeado nos testes: " + status);
          });
      }
