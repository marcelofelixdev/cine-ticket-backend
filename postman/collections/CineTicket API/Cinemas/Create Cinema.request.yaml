$kind: http-request
name: Create Cinema
method: POST
url: '{{baseUrl}}/api/v1/cinemas'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Cine Center",
      "cnpj": "12.345.678/0001-90",
      "endereco": "Rua das Flores, 123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;
      const json = pm.response.json();

      if (status === 200 || status === 201) {
          pm.test("Status é 200 ou 201 (criação bem-sucedida)", function () {
              pm.expect(status).to.be.oneOf([200, 201]);
          });

          pm.test("Body contém id", function () {
              pm.expect(json).to.have.property("id");
          });

          pm.test("Body contém nome", function () {
              pm.expect(json).to.have.property("nome");
          });

          pm.test("Body contém cnpj", function () {
              pm.expect(json).to.have.property("cnpj");
          });

          pm.test("Body contém endereco", function () {
              pm.expect(json).to.have.property("endereco");
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Tempo de resposta menor que 3000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(3000);
          });

          pm.environment.set("cinemaId", json.id);

      } else if (status === 400) {
          pm.test("Status é 400 (Bad Request)", function () {
              pm.expect(status).to.equal(400);
          });

          pm.test("Body contém campo error", function () {
              pm.expect(json).to.have.property("error");
          });

          pm.test("Body contém campo message", function () {
              pm.expect(json).to.have.property("message");
          });

      } else if (status === 401) {
          pm.test("Status é 401 (Não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });

      } else if (status === 422) {
          pm.test("Status é 422 (Erro de Validação)", function () {
              pm.expect(status).to.equal(422);
          });

          pm.test("Body contém error = 'Erro de Validação de Dados'", function () {
              pm.expect(json).to.have.property("error", "Erro de Validação de Dados");
          });

      } else if (status === 500) {
          pm.test("Status é 500 (Erro interno — ex: CNPJ duplicado)", function () {
              pm.expect(status).to.equal(500);
          });

          pm.test("Body contém campo error", function () {
              pm.expect(json).to.have.property("error");
          });

          pm.test("Body contém campo message", function () {
              pm.expect(json).to.have.property("message");
          });

      } else {
          pm.test("Status inesperado: " + status, function () {
              pm.expect.fail("Status não mapeado nos testes: " + status);
          });
      }
