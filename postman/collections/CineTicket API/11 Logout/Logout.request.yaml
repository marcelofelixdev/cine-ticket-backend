$kind: http-request
name: Logout
description: |-
  Revoga a sessão do refresh token (cookie) e apaga o cookie.
method: POST
url: '{{baseUrl}}/api/v1/auth/logout'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
      pm.test("Apaga o cookie", () => pm.expect(pm.response.headers.get("Set-Cookie")).to.include("Max-Age=0"));
