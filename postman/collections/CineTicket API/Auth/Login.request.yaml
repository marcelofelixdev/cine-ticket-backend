$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/api/v1/auth/login"
order: 1000
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "marcelo@admin.com",
      "senha": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      if (status === 200) {
          // ── Cenários de SUCESSO ──────────────────────────────────────────

          pm.test("Status 200 OK", function () {
              pm.response.to.have.status(200);
          });

          pm.test("Response tem campo token", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("token");
              pm.expect(json.token).to.be.a("string").and.not.empty;
          });

          pm.test("Token é um JWT válido (3 partes separadas por ponto)", function () {
              const json = pm.response.json();
              const parts = json.token.split(".");
              pm.expect(parts).to.have.lengthOf(3, "JWT deve ter exatamente 3 partes separadas por '.'");
              parts.forEach(function (part) {
                  pm.expect(part).to.not.be.empty;
              });
          });

          pm.test("Salva token no environment", function () {
              const json = pm.response.json();
              pm.environment.set("token", json.token);
              pm.expect(pm.environment.get("token")).to.equal(json.token);
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Response time é menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

      } else if (status === 401) {
          // ── Cenários de ERRO — Autenticação (401 Unauthorized) ──────────
          // Disparado quando: senha incorreta ou e-mail não cadastrado

          pm.test("Status 401 Unauthorized", function () {
              pm.response.to.have.status(401);
          });

          pm.test("Token NÃO é salvo no environment em caso de 401", function () {
              // Garante que um token antigo não seja sobrescrito com valor inválido
              pm.expect(pm.response.code).to.equal(401);
          });

      } else if (status === 400) {
          // ── Cenários de ERRO — Regra de Negócio (400 Bad Request) ───────
          // Disparado quando: body sem campo obrigatório ou e-mail com formato inválido
          // Estrutura esperada: { timestamp, status, error, message, path }

          pm.test("Status 400 Bad Request", function () {
              pm.response.to.have.status(400);
          });

          pm.test("Response body tem estrutura de erro esperada (400)", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("timestamp");
              pm.expect(json).to.have.property("status").that.equals(400);
              pm.expect(json).to.have.property("error");
              pm.expect(json).to.have.property("message");
              pm.expect(json).to.have.property("path");
          });

          pm.test("Campo 'error' indica violação de regra de negócio", function () {
              const json = pm.response.json();
              pm.expect(json.error).to.be.a("string").and.not.empty;
          });

      } else if (status === 422) {
          // ── Cenários de ERRO — Validação (422 Unprocessable Entity) ─────
          // Disparado quando: campos obrigatórios ausentes ou formato inválido (Bean Validation)

          pm.test("Status 422 Unprocessable Entity", function () {
              pm.response.to.have.status(422);
          });

          pm.test("Response body tem estrutura de erro esperada (422)", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("timestamp");
              pm.expect(json).to.have.property("status").that.equals(422);
              pm.expect(json).to.have.property("error");
              pm.expect(json).to.have.property("message");
              pm.expect(json).to.have.property("path");
          });

          pm.test("Campo 'message' descreve o erro de validação", function () {
              const json = pm.response.json();
              pm.expect(json.message).to.be.a("string").and.not.empty;
          });

      } else {
          // ── Status inesperado ────────────────────────────────────────────
          pm.test("Status inesperado: " + status, function () {
              pm.expect.fail("Status " + status + " não é esperado para este endpoint. Verifique o request body e as credenciais.");
          });
      }
