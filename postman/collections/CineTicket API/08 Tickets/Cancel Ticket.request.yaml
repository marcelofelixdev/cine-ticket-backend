$kind: http-request
name: Cancel Ticket
description: |-
  Permitido até 30 minutos antes da sessão. Se o ingresso estava aprovado, gera um evento de reembolso.
method: PUT
url: '{{baseUrl}}/api/v1/tickets/{{ticketId}}/cancel'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Ingresso cancelado", () => pm.expect(pm.response.json().status).to.eql("CANCELLED"));
