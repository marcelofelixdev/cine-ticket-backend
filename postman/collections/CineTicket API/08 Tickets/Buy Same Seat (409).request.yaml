$kind: http-request
name: Buy Same Seat (409)
method: POST
url: '{{baseUrl}}/api/v1/tickets'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": {{sessionId}},
      "seatId": {{seatId}},
      "ticketType": "INTEIRA",
      "cartaoToken": "tok_postman"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409: assento já ocupado", () => pm.response.to.have.status(409));

      pm.test("Erro no formato ProblemDetail", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p).to.have.property("title");
          pm.expect(p.status).to.eql(pm.response.code);
          pm.expect(p).to.have.property("correlationId");
      });
