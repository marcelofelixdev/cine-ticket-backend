$kind: http-request
name: My Tickets
method: GET
url: '{{baseUrl}}/api/v1/tickets/my-tickets'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Lista o ingresso comprado", () => pm.expect(pm.response.json().content.length).to.be.at.least(1));
