$kind: http-request
name: Download PDF
method: GET
url: '{{baseUrl}}/api/v1/tickets/{{ticketId}}/pdf'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("PDF (200) ou pagamento ainda não aprovado (422)", () =>
          pm.expect(pm.response.code).to.be.oneOf([200, 422]));
      if (pm.response.code === 200) {
          pm.test("Content-Type application/pdf", () =>
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/pdf"));
      }
