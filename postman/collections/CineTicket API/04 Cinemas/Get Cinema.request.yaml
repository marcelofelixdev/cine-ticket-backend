$kind: http-request
name: Get Cinema
method: GET
url: '{{baseUrl}}/api/v1/cinemas/{{cinemaId}}'
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("É o cinema criado", () => pm.expect(pm.response.json().nome).to.eql("Cine Postman"));
