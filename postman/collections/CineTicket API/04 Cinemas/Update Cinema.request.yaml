$kind: http-request
name: Update Cinema
method: PUT
url: '{{baseUrl}}/api/v1/cinemas/{{cinemaId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Cine Postman Centro",
      "cnpj": "{{cnpj}}",
      "endereco": "Rua dos Testes, 100 - São Paulo/SP"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Nome atualizado", () => pm.expect(pm.response.json().nome).to.eql("Cine Postman Centro"));
