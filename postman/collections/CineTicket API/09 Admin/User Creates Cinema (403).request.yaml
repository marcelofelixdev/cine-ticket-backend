$kind: http-request
name: User Creates Cinema (403)
method: POST
url: '{{baseUrl}}/api/v1/cinemas'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Não deveria",
      "cnpj": "99999999000199",
      "endereco": "Rua X"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403: só admin escreve no catálogo", () => pm.response.to.have.status(403));

      pm.test("Erro no formato ProblemDetail", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p).to.have.property("title");
          pm.expect(p.status).to.eql(pm.response.code);
          pm.expect(p).to.have.property("correlationId");
      });
