$kind: http-request
name: Validation Error (422)
method: POST
url: '{{baseUrl}}/api/v1/cinemas'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 422", () => pm.response.to.have.status(422));
      pm.test("Lista os campos inválidos", () => {
          const fields = pm.response.json().errors.map(e => e.field);
          pm.expect(fields).to.include.members(["nome", "cnpj", "endereco"]);
      });

      pm.test("Erro no formato ProblemDetail", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p).to.have.property("title");
          pm.expect(p.status).to.eql(pm.response.code);
          pm.expect(p).to.have.property("correlationId");
      });
