$kind: http-request
name: No Token (401)
method: GET
url: '{{baseUrl}}/api/v1/tickets/my-tickets'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("WWW-Authenticate: Bearer", () => pm.expect(pm.response.headers.get("WWW-Authenticate")).to.eql("Bearer"));

      pm.test("Erro no formato ProblemDetail", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          const p = pm.response.json();
          pm.expect(p).to.have.property("title");
          pm.expect(p.status).to.eql(pm.response.code);
          pm.expect(p).to.have.property("correlationId");
      });
