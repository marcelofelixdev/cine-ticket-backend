$kind: http-request
name: Create User
method: POST
url: '{{baseUrl}}/api/v1/users'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "John Doe",
      "email": "john@example.com",
      "senha": "password123",
      "roleIds": [1]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      // ── SUCESSO (200 ou 201) ──────────────────────────────────────────────────
      if (status === 200 || status === 201) {

          pm.test("Status é 200 ou 201 (criação bem-sucedida)", () => {
              pm.expect(status).to.be.oneOf([200, 201]);
          });

          pm.test("Content-Type é application/json", () => {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Response time é menor que 3000ms", () => {
              pm.expect(pm.response.responseTime).to.be.below(3000);
          });

          const json = pm.response.json();

          pm.test("Response contém campo 'id'", () => {
              pm.expect(json).to.have.property("id");
          });

          pm.test("Response contém campo 'nome'", () => {
              pm.expect(json).to.have.property("nome");
          });

          pm.test("Response contém campo 'email'", () => {
              pm.expect(json).to.have.property("email");
          });

          pm.test("Campo 'email' bate com o enviado no body", () => {
              const requestBody = JSON.parse(pm.request.body.raw);
              pm.expect(json.email).to.eql(requestBody.email);
          });

          pm.test("Campo 'senha' NÃO está presente na resposta (segurança)", () => {
              pm.expect(json).to.not.have.property("senha");
          });

      // ── ERRO 400 (email duplicado / regra de negócio) ─────────────────────────
      } else if (status === 400) {

          pm.test("Status é 400 (email duplicado / regra de negócio)", () => {
              pm.expect(status).to.eql(400);
          });

          pm.test("Content-Type é application/json", () => {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          const json400 = pm.response.json();

          pm.test("Body contém campo 'error'", () => {
              pm.expect(json400).to.have.property("error");
          });

          pm.test("Campo 'error' é 'Violação de Regra de Negócio'", () => {
              pm.expect(json400.error).to.eql("Violação de Regra de Negócio");
          });

          pm.test("Body contém campo 'message'", () => {
              pm.expect(json400).to.have.property("message");
          });

          pm.test("Campo 'message' contém 'Email já cadastrado'", () => {
              pm.expect(json400.message).to.include("Email já cadastrado");
          });

      // ── ERRO 401 (sem token / token inválido) ─────────────────────────────────
      } else if (status === 401) {

          pm.test("Status é 401 (não autorizado)", () => {
              pm.expect(status).to.eql(401);
          });

          pm.test("Token ausente ou inválido resultou em 401", () => {
              pm.expect(status).to.eql(401);
          });

      // ── ERRO 422 (validação — campos obrigatórios faltando) ───────────────────
      } else if (status === 422) {

          pm.test("Status é 422 (erro de validação)", () => {
              pm.expect(status).to.eql(422);
          });

          pm.test("Content-Type é application/json", () => {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          const json422 = pm.response.json();

          pm.test("Body contém campo 'error'", () => {
              pm.expect(json422).to.have.property("error");
          });

          pm.test("Campo 'error' é 'Erro de Validação de Dados'", () => {
              pm.expect(json422.error).to.eql("Erro de Validação de Dados");
          });

          pm.test("Body contém campo 'message' descrevendo campos inválidos", () => {
              pm.expect(json422).to.have.property("message");
              pm.expect(json422.message).to.be.a("string").and.to.have.length.above(0);
          });

      // ── STATUS INESPERADO ─────────────────────────────────────────────────────
      } else {

          pm.test("Status inesperado: " + status, () => {
              pm.expect.fail(
                  "Status " + status + " não era esperado para este endpoint. Body: " +
                  pm.response.text()
              );
          });

      }
