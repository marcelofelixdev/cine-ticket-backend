$kind: http-request
name: Get All Sessions
method: GET
url: '{{baseUrl}}/api/v1/sessions'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;

      // ── 200 – Listagem bem-sucedida ───────────────────────────────────────
      if (status === 200) {
          pm.test("Status é 200", function () {
              pm.expect(status).to.equal(200);
          });

          pm.test("Content-Type é application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          pm.test("Response time é menor que 2000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(2000);
          });

          pm.test("Body é um array", function () {
              const json = pm.response.json();
              pm.expect(json).to.be.an("array");
          });

          pm.test("Se array não vazio, cada item tem id, horarioInicio e valorBase", function () {
              const json = pm.response.json();
              if (json.length > 0) {
                  json.forEach(function (session) {
                      pm.expect(session).to.have.property("id");
                      pm.expect(session).to.have.property("horarioInicio");
                      pm.expect(session).to.have.property("valorBase");
                  });
              }
          });
      }

      // ── 401 – Não autorizado ──────────────────────────────────────────────
      else if (status === 401) {
          pm.test("Status é 401 (Não autorizado)", function () {
              pm.expect(status).to.equal(401);
          });
      }
