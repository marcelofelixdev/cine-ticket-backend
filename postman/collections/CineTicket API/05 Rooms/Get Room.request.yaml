$kind: http-request
name: Get Room
method: GET
url: '{{baseUrl}}/api/v1/rooms/{{roomId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Capacidade 30", () => pm.expect(pm.response.json().capacidade).to.eql(30));
