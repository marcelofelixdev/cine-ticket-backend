name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Vazio em PRs de forks/Dependabot: a etapa do Sonar é pulada sem quebrar o build.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v7
      with:
        # Histórico completo: o Sonar usa o blame para identificar código novo.
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build, testes e cobertura (Testcontainers + JaCoCo)
      run: bash mvnw --batch-mode verify

    - name: Análise no SonarQube Cloud
      if: ${{ env.SONAR_TOKEN != '' }}
      run: bash mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar

  # Publica a imagem no GitHub Container Registry a cada merge na main,
  # só depois de o build e os testes passarem.
  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # Opcional: URL do deploy hook do Render (secret). Sem ela, só publica a imagem.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tags da imagem (latest + SHA do commit)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest
          type=sha,format=short

    - name: Build e push da imagem
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy no Render
      if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
      run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
